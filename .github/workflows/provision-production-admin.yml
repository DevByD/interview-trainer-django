name: Provision Production Admin (One-Time / Manual)

# ==============================================================================
# ONE-TIME / MANUAL WORKFLOW FOR PROVISIONING PRODUCTION ADMIN SUPERUSER
#
# Security Features:
#   1. Manual-only trigger via workflow_dispatch (never runs automatically).
#   2. Strict host key verification using ~/.ssh/known_hosts (StrictHostKeyChecking=yes).
#   3. Password is piped directly through encrypted SSH stdin (standard input).
#   4. Password NEVER appears in SSH command strings, process listings (ps),
#      shell arguments, history, files, or GitHub Actions console output.
#   5. Restarts only the targeted PM2 process: "runinterview".
#   6. Verifies Superuser status without printing secrets or password hashes.
#
# Required GitHub Secrets:
#   1. SSH_PRIVATE_KEY           - SSH private key for ubuntu@manya.apolloaitech.co
#   2. PRODUCTION_ADMIN_PASSWORD  - Secure password for the Admin account
# ==============================================================================

on:
  workflow_dispatch:

jobs:
  provision-admin:
    name: Provision Production Admin Superuser
    runs-on: ubuntu-latest

    steps:
      - name: Execute Admin Provisioning via Encrypted Stdin Stream
        env:
          PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ADMIN_PASSWORD: ${{ secrets.PRODUCTION_ADMIN_PASSWORD }}
          HOSTNAME: manya.apolloaitech.co
          USER_NAME: ubuntu
        run: |
          if [ -z "$PRIVATE_KEY" ]; then
            echo "::error::SSH_PRIVATE_KEY secret is not configured in GitHub Repository Secrets."
            exit 1
          fi

          if [ -z "$ADMIN_PASSWORD" ]; then
            echo "::error::PRODUCTION_ADMIN_PASSWORD secret is not configured in GitHub Repository Secrets."
            echo "Please set PRODUCTION_ADMIN_PASSWORD under: Settings -> Secrets and variables -> Actions"
            exit 1
          fi

          # 1. Setup secure SSH known_hosts with strict host verification
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -t ed25519,rsa -H "$HOSTNAME" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts

          # 2. Setup private key with restricted permissions
          echo "$PRIVATE_KEY" > private_key && chmod 600 private_key
          SSH_OPTS="-i private_key -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes"

          # 3. Create standalone provisioning script (contains ZERO secrets)
          cat << 'PYEOF' > /tmp/provision_admin.py
          import os
          import sys
          from pathlib import Path

          # Ensure project root is first in Python module search path
          PROJECT_ROOT = Path("/home/ubuntu/interview-trainer-django").resolve()
          if str(PROJECT_ROOT) not in sys.path:
              sys.path.insert(0, str(PROJECT_ROOT))
          os.chdir(str(PROJECT_ROOT))

          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings")

          import django
          django.setup()

          from django.conf import settings
          from django.contrib.auth.models import User

          # Step A: Verify database target (non-sensitive inspection)
          db_cfg = settings.DATABASES.get("default", {})
          db_engine = db_cfg.get("ENGINE", "Unknown")
          db_name = db_cfg.get("NAME", "Unknown")
          db_host = db_cfg.get("HOST", "") or "local/socket"
          print(f"[DATABASE INFO] Engine: {db_engine}")
          print(f"[DATABASE INFO] Target DB: {db_name}")
          print(f"[DATABASE INFO] Host: {db_host}")

          # Step B: Read password securely from stdin stream
          password = sys.stdin.readline().rstrip("\r\n")
          if not password:
              print("[ERROR] No password received over stdin stream.")
              sys.exit(1)

          target_username = "Admin"
          target_email = "admin23@gmail.com"

          # Step C: Look up existing user (case-insensitive) or create new superuser
          user = (
              User.objects.filter(username__iexact=target_username).first()
              or User.objects.filter(email__iexact=target_email).first()
          )

          if user:
              user.username = target_username
              user.email = target_email
              user.is_staff = True
              user.is_superuser = True
              user.is_active = True
              user.set_password(password)
              user.save()
              print(f"[SUCCESS] Updated existing user '{user.username}' ({user.email}) as active Superuser.")
          else:
              user = User.objects.create_superuser(target_username, target_email, password)
              print(f"[SUCCESS] Created new Superuser '{user.username}' ({user.email}).")

          del password

          # Step D: Verify provisioned user state without exposing credentials
          user = User.objects.filter(username__iexact=target_username).first()
          if user:
              print(f"[VERIFIED] Username: {user.username}")
              print(f"[VERIFIED] Email: {user.email}")
              print(f"[VERIFIED] is_active: {user.is_active}")
              print(f"[VERIFIED] is_staff: {user.is_staff}")
              print(f"[VERIFIED] is_superuser: {user.is_superuser}")
              print(f"[VERIFIED] Has usable password: {user.has_usable_password()}")
          else:
              print("[ERROR] Admin user was not found after provisioning!")
              sys.exit(1)
          PYEOF

          # 4. Copy provisioning script to remote server
          scp ${SSH_OPTS} /tmp/provision_admin.py ${USER_NAME}@${HOSTNAME}:/tmp/provision_admin.py
          rm -f /tmp/provision_admin.py

          # 5. Pipe password strictly via standard input (stdin) into the remote Python process
          printf "%s\n" "$ADMIN_PASSWORD" | ssh ${SSH_OPTS} ${USER_NAME}@${HOSTNAME} '
          set -e
          cd /home/ubuntu/interview-trainer-django
          source venv/bin/activate
          export PYTHONPATH="/home/ubuntu/interview-trainer-django:$PYTHONPATH"

          echo "=== 1. Running Django System Check ==="
          python manage.py check

          echo "=== 2. Provisioning Production Admin Superuser via Stdin Stream ==="
          /home/ubuntu/interview-trainer-django/venv/bin/python /tmp/provision_admin.py

          echo "=== 3. Restarting PM2 Production Process (runinterview) ==="
          pm2 restart runinterview

          echo "=== 4. Cleaning Up Remote Temporary Script ==="
          rm -f /tmp/provision_admin.py

          echo "=== 5. Production Admin Provisioning Completed Successfully! ==="
          '

          # 6. Clean up local private key file
          rm -f private_key
