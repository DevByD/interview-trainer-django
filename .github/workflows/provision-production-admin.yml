name: Provision Production Admin (One-Time / Manual)

# ==============================================================================
# ONE-TIME / MANUAL WORKFLOW FOR PROVISIONING PRODUCTION ADMIN SUPERUSER
#
# Security Features:
#   1. Manual-only trigger via workflow_dispatch (never runs automatically).
#   2. Strict host key verification using ~/.ssh/known_hosts (StrictHostKeyChecking=yes).
#   3. Password is piped directly through encrypted SSH stdin (standard input).
#   4. Password NEVER appears in SSH command strings, process listings (ps),
#      shell arguments, history, files, or GitHub Actions console output.
#   5. Restarts only the targeted PM2 process: "runinterview".
#   6. Verifies Superuser status without printing secrets or password hashes.
#
# Required GitHub Secrets:
#   1. SSH_PRIVATE_KEY           - SSH private key for ubuntu@manya.apolloaitech.co
#   2. PRODUCTION_ADMIN_PASSWORD  - Secure password for the Admin account
# ==============================================================================

on:
  workflow_dispatch:

jobs:
  provision-admin:
    name: Provision Production Admin Superuser
    runs-on: ubuntu-latest

    steps:
      - name: Execute Admin Provisioning via Encrypted Stdin Stream
        env:
          PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ADMIN_PASSWORD: ${{ secrets.PRODUCTION_ADMIN_PASSWORD }}
          HOSTNAME: manya.apolloaitech.co
          USER_NAME: ubuntu
        run: |
          if [ -z "$PRIVATE_KEY" ]; then
            echo "::error::SSH_PRIVATE_KEY secret is not configured in GitHub Repository Secrets."
            exit 1
          fi

          if [ -z "$ADMIN_PASSWORD" ]; then
            echo "::error::PRODUCTION_ADMIN_PASSWORD secret is not configured in GitHub Repository Secrets."
            echo "Please set PRODUCTION_ADMIN_PASSWORD under: Settings -> Secrets and variables -> Actions"
            exit 1
          fi

          # 1. Setup secure SSH known_hosts with strict host verification
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -t ed25519,rsa -H "$HOSTNAME" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts

          # 2. Setup private key with restricted permissions
          echo "$PRIVATE_KEY" > private_key && chmod 600 private_key
          SSH_OPTS="-i private_key -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes"

          # 3. Pipe password strictly via standard input (stdin) into the remote Python process.
          # The password is NEVER part of the SSH command string or shell arguments.
          printf "%s\n" "$ADMIN_PASSWORD" | ssh ${SSH_OPTS} ${USER_NAME}@${HOSTNAME} '
          set -e
          cd /home/ubuntu/interview-trainer-django
          source venv/bin/activate

          echo "=== 1. Verifying Production Database Target ==="
          python -c "
          import os, django
          os.environ.setdefault(\"DJANGO_SETTINGS_MODULE\", \"config.settings\")
          django.setup()
          from django.conf import settings
          cfg = settings.DATABASES.get(\"default\", {})
          print(f\"[DATABASE INFO] Engine: {cfg.get('ENGINE', 'Unknown')}\")
          print(f\"[DATABASE INFO] Target DB: {cfg.get('NAME', 'Unknown')}\")
          print(f\"[DATABASE INFO] Host: {cfg.get('HOST') or 'local/socket'}\")
          "

          echo "=== 2. Running Django System Check ==="
          python manage.py check

          echo "=== 3. Provisioning Admin Superuser via Stdin Stream ==="
          python -c "
          import os, sys, django
          os.environ.setdefault(\"DJANGO_SETTINGS_MODULE\", \"config.settings\")
          django.setup()
          from django.contrib.auth.models import User

          # Read secret directly from stdin descriptor without command-line exposure
          password = sys.stdin.readline().rstrip(\x27\r\n\x27)
          if not password:
              print(\x27[ERROR] No password received over stdin stream.\x27)
              sys.exit(1)

          target_username = \x27Admin\x27
          target_email = \x27admin23@gmail.com\x27

          # Look up existing account by case-insensitive username or email
          user = (
              User.objects.filter(username__iexact=target_username).first()
              or User.objects.filter(email__iexact=target_email).first()
          )

          if user:
              user.username = target_username
              user.email = target_email
              user.is_staff = True
              user.is_superuser = True
              user.is_active = True
              user.set_password(password)
              user.save()
              print(f\x27[SUCCESS] Updated existing user {user.username} ({user.email}) as active Superuser.\x27)
          else:
              user = User.objects.create_superuser(target_username, target_email, password)
              print(f\x27[SUCCESS] Created new Superuser {user.username} ({user.email}).\x27)

          del password
          "

          echo "=== 4. Verifying Provisioned Admin Account State ==="
          python -c "
          import os, sys, django
          os.environ.setdefault(\"DJANGO_SETTINGS_MODULE\", \"config.settings\")
          django.setup()
          from django.contrib.auth.models import User

          user = User.objects.filter(username__iexact=\x27Admin\x27).first()
          if user:
              print(f\x27[VERIFIED] Username: {user.username}\x27)
              print(f\x27[VERIFIED] Email: {user.email}\x27)
              print(f\x27[VERIFIED] is_active: {user.is_active}\x27)
              print(f\x27[VERIFIED] is_staff: {user.is_staff}\x27)
              print(f\x27[VERIFIED] is_superuser: {user.is_superuser}\x27)
              print(f\x27[VERIFIED] Has usable password: {user.has_usable_password()}\x27)
          else:
              print(\x27[ERROR] Admin user was not found after provisioning!\x27)
              exit(1)
          "

          echo "=== 5. Restarting PM2 Production Process (runinterview) ==="
          pm2 restart runinterview

          echo "=== 6. Production Admin Provisioning Completed Successfully! ==="
          '

          # 4. Clean up local private key file
          rm -f private_key
